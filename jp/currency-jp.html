<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <title>金融情報ダッシュボード</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="../css/pages/financial-dashboard.css" rel="stylesheet">
</head>

<body class="theme-jp">
<header>
    <h1><i class="fas fa-chart-line"></i> 金融情報ダッシュボード</h1>
    <p>最新の為替レート、暗号通貨の価格をチェック</p>
</header>

<div class="dashboard">
    <!-- 为替レート表示 - 最上部に配置 -->
    <div class="card wide-card">
        <h2><i class="fas fa-yen-sign"></i> 主要為替レート (JPY基準)</h2>
        <div id="exchange-rates">データを読み込み中...</div>
    </div>

    <!-- 株式市場データ -->
    <div class="card wide-card">
        <h2><i class="fas fa-chart-line"></i> 株式市場</h2>
        <div id="stock-market">データを読み込み中...</div>
    </div>

    <!-- 経済指標 - 新規 -->
    <div class="card medium-card">
        <h2><i class="fas fa-chart-bar"></i> 経済指標</h2>
        <div id="economic-indicators">データを読み込み中...</div>
    </div>

    <!-- 商品価格 - 新規 -->
    <div class="card medium-card">
        <h2><i class="fas fa-oil-can"></i> 商品価格</h2>
        <div id="commodity-prices">データを読み込み中...</div>
    </div>

    <!-- 暗号通貨価格表示 -->
    <div class="card medium-card">
        <h2><i class="fab fa-bitcoin"></i> 暗号通貨価格</h2>
        <div id="crypto-prices">データを読み込み中...</div>
    </div>

    <!-- 貴金属価格 -->
    <div class="card medium-card">
        <h2><i class="fas fa-coins"></i> 貴金属価格 (USD)</h2>
        <div id="metal-prices">データを読み込み中...</div>
    </div>

    <!-- 通貨コンバーターを最下部に配置 -->
    <div class="card full-card">
        <h2><i class="fas fa-exchange-alt"></i> 通貨コンバーター</h2>
        <div class="converter">
            <input id="amount" placeholder="金額" type="number" value="1000">
            <select id="from-currency">
                <option selected value="JPY">日本円 (JPY)</option>
                <option value="USD">米ドル (USD)</option>
                <option value="EUR">ユーロ (EUR)</option>
                <option value="CNY">中国元 (CNY)</option>
                <option value="GBP">英ポンド (GBP)</option>
            </select>
            <select id="to-currency">
                <option value="JPY">日本円 (JPY)</option>
                <option selected value="USD">米ドル (USD)</option>
                <option value="EUR">ユーロ (EUR)</option>
                <option value="CNY">中国元 (CNY)</option>
                <option value="GBP">英ポンド (GBP)</option>
            </select>
            <button id="convert-btn"><i class="fas fa-calculator"></i> 換算</button>
            <div class="conversion-result" id="conversion-result" style="display:none;"></div>
        </div>
    </div>
</div>

<script src="../../../../../js/financial/dashboard.js"></script>
</body>

</html>
