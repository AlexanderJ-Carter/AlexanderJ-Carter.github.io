    <!-- 主要内容 -->
    <main class="main-content">
        <!-- Hero区域 -->
        <section class="calendar-hero" id="calendar-hero">
            <div class="container">
                <div class="row align-items-center">
                    <div class="col-lg-6" data-aos="fade-right">
                        <div class="calendar-intro">
                            <h1>智能日历</h1>
                            <p class="lead">管理您的时间，规划您的生活。支持节假日显示、自定义日程和图片导出功能。</p>
                            <div class="calendar-features">
                                <div class="feature-item neumorphism-feature">
                                    <i class="fas fa-calendar-check"></i>
                                    <span>节假日显示</span>
                                </div>
                                <div class="feature-item neumorphism-feature">
                                    <i class="fas fa-tasks"></i>
                                    <span>日程管理</span>
                                </div>
                                <div class="feature-item neumorphism-feature">
                                    <i class="fas fa-download"></i>
                                    <span>图片导出</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6" data-aos="fade-left">
                        <div class="calendar-preview">
                            <div class="preview-card neumorphism-card">
                                <i class="fas fa-calendar-alt"></i>
                                <h3>今日</h3>
                                <div class="current-date" id="currentDate"></div>
                                <div class="current-lunar" id="currentLunar"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 日历控制区域 -->
        <section class="calendar-controls" id="calendar-controls">
            <div class="container">
                <div class="row">
                    <div class="col-12">
                        <div class="control-panel neumorphism" data-aos="fade-up">
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="calendar-navigation">
                                    <button class="btn neumorphism-button" id="prevMonth">
                                        <i class="fas fa-chevron-left"></i> 上月
                                    </button>
                                    <h2 class="current-month mx-3" id="currentMonth"></h2>
                                    <button class="btn neumorphism-button" id="nextMonth">
                                        下月 <i class="fas fa-chevron-right"></i>
                                    </button>
                                </div>
                                <div class="calendar-actions">
                                    <button class="btn neumorphism-button" data-bs-toggle="modal"
                                        data-bs-target="#eventModal">
                                        <i class="fas fa-plus"></i> 添加日程
                                    </button>
                                    <button class="btn neumorphism-button" id="exportCalendar">
                                        <i class="fas fa-download"></i> 导出图片
                                    </button>
                                    <button class="btn neumorphism-button" id="todayBtn">
                                        <i class="fas fa-calendar-day"></i> 今天
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 日历主体 -->
        <section class="calendar-main" id="calendar-main">
            <div class="container">
                <div class="row">
                    <div class="col-12">
                        <div class="calendar-container neumorphism" data-aos="fade-up" id="calendarContainer">
                            <div class="calendar-grid">
                                <div class="calendar-weekdays">
                                    <div class="weekday">日</div>
                                    <div class="weekday">一</div>
                                    <div class="weekday">二</div>
                                    <div class="weekday">三</div>
                                    <div class="weekday">四</div>
                                    <div class="weekday">五</div>
                                    <div class="weekday">六</div>
                                </div>
                                <div class="calendar-days" id="calendarDays">
                                    <!-- 动态生成日期 -->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- 添加日程模态框 -->
    <div class="modal fade" id="eventModal" tabindex="-1" aria-labelledby="eventModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="eventModalLabel">
                        <i class="fas fa-calendar-plus"></i> 添加日程
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
                </div>
                <div class="modal-body">
                    <form id="eventForm">
                        <div class="mb-3">
                            <label for="eventTitle" class="form-label">日程标题</label>
                            <input type="text" class="form-control" id="eventTitle" required>
                        </div>
                        <div class="mb-3">
                            <label for="eventDate" class="form-label">日期</label>
                            <input type="date" class="form-control" id="eventDate" required>
                        </div>
                        <div class="mb-3">
                            <label for="eventTime" class="form-label">时间</label>
                            <input type="time" class="form-control" id="eventTime">
                        </div>
                        <div class="mb-3">
                            <label for="eventDescription" class="form-label">描述</label>
                            <textarea class="form-control" id="eventDescription" rows="3"></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="eventColor" class="form-label">颜色标签</label>
                            <select class="form-select" id="eventColor">
                                <option value="primary">蓝色</option>
                                <option value="success">绿色</option>
                                <option value="warning">黄色</option>
                                <option value="danger">红色</option>
                                <option value="info">青色</option>
                                <option value="secondary">灰色</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="saveEvent">保存日程</button>
                </div>
            </div>
        </div>
    </div>

        AOS.init({
            duration: 800,
            easing: 'ease-in-out',
            once: true
        });
    </script>
