<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お問い合わせ</title>
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../js/verification.js" defer></script>
</head>

<body>
    <!-- 在<body>标签开始后添加验证逻辑 -->
    <script>
        // アクセス権限を確認
        document.addEventListener('DOMContentLoaded', function () {
            if (!isVerified('contact_jp_verified')) {
                // 無限ループを防ぐためにリダイレクトカウンターを使用
                if (checkRedirectAttempts('contact', 'jp')) {
                    // 検証ページに強制リダイレクト
                    window.location.replace('../verify.html?redirect=jp/contact-jp.html');
                }
            } else {
                // 検証成功、カウンターをリセット
                resetRedirectCounter('contact', 'jp');
            }
        });

        // 戻るボタンを捕捉
        window.addEventListener('pageshow', function (event) {
            if (event.persisted || (performance.getEntriesByType && performance.getEntriesByType("navigation")[0].type === 'back_forward')) {
                // キャッシュからページが読み込まれた場合、検証状態を再確認
                if (!isVerified('contact_jp_verified')) {
                    if (checkRedirectAttempts('contact', 'jp')) {
                        window.location.replace('../verify.html?redirect=jp/contact-jp.html');
                    }
                }
            }
        });
    </script>

    <div id="loading-indicator" style="display:none;">読み込み中...</div>
    <div id="content">
        <h1>お問い合わせ</h1>
        <form id="contact-form">
            <label for="name">お名前:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">メールアドレス:</label>
            <input type="email" id="email" name="email" required>

            <label for="message">メッセージ:</label>
            <textarea id="message" name="message" required></textarea>

            <button type="submit">送信</button>
        </form>
    </div>

    <script>
        // フォーム送信時の処理
        document.getElementById('contact-form').addEventListener('submit', function (event) {
            event.preventDefault();

            // 入力値の取得
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const message = document.getElementById('message').value;

            // 簡易バリデーション
            if (!name || !email || !message) {
                alert('すべてのフィールドを入力してください。');
                return;
            }

            // 送信処理（ここではダミーの処理を実行）
            document.getElementById('loading-indicator').style.display = 'block';
            setTimeout(() => {
                document.getElementById('loading-indicator').style.display = 'none';
                alert('メッセージが送信されました。');
                document.getElementById('contact-form').reset();
            }, 1500);
        });
    </script>
</body>

</html>
