    <title>ページが見つかりません - 404</title>
    <script>
        // GitHub Pages の404ページの言語検出
        (function () {
            // すでに正しい404ページにいる場合はリダイレクトをスキップ
            if (window.location.pathname.endsWith('/404-jp.html')) {
                return;
            }

            // 現在のパスを取得
            var path = window.location.pathname.toLowerCase();
            var redirectUrl = '';
            var shouldRedirect = false;

            // 日本語以外のコンテキストにいるかどうかを確認
            if (!(path.match(/\/jp\//i) || path.match(/\/jp-.*\.html$/i) || path.match(/\/.*-jp\.html$/i))) {
                if (path.match(/\/en\//i) || path.match(/\/en-.*\.html$/i) || path.match(/\/.*-en\.html$/i)) {
                    redirectUrl = '/en/404-en.html';
                    shouldRedirect = true;
                } else if (path.match(/\/it\//i) || path.match(/\/it-.*\.html$/i) || path.match(/\/.*-it\.html$/i)) {
                    redirectUrl = '/it/404-it.html';
                    shouldRedirect = true;
                } else {
                    // 認識されないパスの場合、デフォルトは中国語
                    redirectUrl = '/404.html';
                    shouldRedirect = true;
                }
            }

            // 必要に応じてリダイレクト
            if (shouldRedirect && redirectUrl) {
                // GitHub Pagesのプロジェクトパスを処理
                var projectPath = '';
                var hostParts = window.location.hostname.split('.');
                if (hostParts[0] !== 'localhost' &&
                    !(hostParts[1] === 'github' && hostParts[2] === 'io') &&
                    window.location.pathname.split('/')[1]) {
                    projectPath = '/' + window.location.pathname.split('/')[1];
                }

                window.location.replace(projectPath + redirectUrl);
            }
        })();
    </script>

<script>
    // このページが正しい言語コンテキストで表示されていることを確認する
    document.addEventListener('DOMContentLoaded', function () {
        const currentPath = window.location.pathname.toLowerCase();
        let shouldRedirect = false;
        let redirectUrl = '';

        // 日本語以外のコンテキストにいるが、日本語の404ページを表示している場合
        if (currentPath.includes('/zh-CN/') ||
            (!currentPath.includes('/jp/') && !currentPath.includes('-jp.html') &&
                !currentPath.includes('/en/') && !currentPath.includes('-en.html') &&
                !currentPath.includes('/it/') && !currentPath.includes('-it.html'))) {
            shouldRedirect = true;
            redirectUrl = '/404.html'; // デフォルトは中国語
        } else if (currentPath.includes('/en/') || currentPath.match(/\/(.*-en)\.html$/)) {
            shouldRedirect = true;
            redirectUrl = '/en/404-en.html';
        } else if (currentPath.includes('/it/') || currentPath.match(/\/(.*-it)\.html$/)) {
            shouldRedirect = true;
            redirectUrl = '/it/404-it.html';
        }

        if (shouldRedirect && redirectUrl) {
            window.location.href = redirectUrl;
        }
    });
</script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        // Generate Stars
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 100; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = `${Math.random() * 100}%`;
            star.style.top = `${Math.random() * 100}%`;
            star.style.setProperty('--duration', `${2 + Math.random() * 3}s`);
            star.style.setProperty('--delay', `${Math.random() * 5}s`);
            starsContainer.appendChild(star);
        }

        // Pacman Game
        const playButton = document.getElementById('playButton');
        const gameContainer = document.getElementById('gameContainer');
        const gameInstructions = document.getElementById('gameInstructions');
        const player = document.getElementById('player');
        const gameScore = document.getElementById('gameScore');
        const gameOver = document.getElementById('gameOver');

        let score = 0;
        let foods = [];
        let ghosts = [];
        let gameActive = false;
        let playerX = 160;
        let playerY = 120;
        let playerSpeed = 3;
        let playerDirection = 0; // 0: right, 1: down, 2: left, 3: up
        let gameLoop;

        function startGame() {
            playButton.style.display = 'none';
            gameContainer.style.display = 'block';
            gameInstructions.style.display = 'block';
            gameOver.style.display = 'none';

            // Reset game state
            score = 0;
            gameScore.textContent = `SCORE: ${score}`;
            playerX = 160;
            playerY = 120;
            playerDirection = 0;
            gameActive = true;

            // Clear existing elements
            clearFoods();
            clearGhosts();

            // Create food
            createFoods(20);

            // Create ghosts
            createGhost('ghost-red', 50, 50);
            createGhost('ghost-pink', 270, 50);
            createGhost('ghost-blue', 50, 190);
            createGhost('ghost-orange', 270, 190);

            // Start game loop
            clearInterval(gameLoop);
            gameLoop = setInterval(updateGame, 20);

            // Update player position
            updatePlayerPosition();
        }

        function updatePlayerPosition() {
            player.style.left = `${playerX}px`;
            player.style.top = `${playerY}px`;

            // Rotate player based on direction
            const rotations = [0, 90, 180, 270];
            player.style.transform = `rotate(${rotations[playerDirection]}deg)`;
        }

        function createFoods(count) {
            for (let i = 0; i < count; i++) {
                createFood();
            }
        }

        function createFood() {
            const food = document.createElement('div');
            food.className = 'food';

            const x = 20 + Math.random() * (gameContainer.clientWidth - 40);
            const y = 20 + Math.random() * (gameContainer.clientHeight - 40);

            food.style.left = `${x}px`;
            food.style.top = `${y}px`;

            gameContainer.appendChild(food);
            foods.push({element: food, x, y});
        }

        function clearFoods() {
            foods.forEach(food => {
                if (food.element.parentNode) {
                    food.element.parentNode.removeChild(food.element);
                }
            });
            foods = [];
        }

        function createGhost(className, x, y) {
            const ghost = document.createElement('div');
            ghost.className = `ghost ${className}`;
            ghost.style.left = `${x}px`;
            ghost.style.top = `${y}px`;

            // Add eyes
            const eyeLeft = document.createElement('div');
            eyeLeft.className = 'ghost-eye ghost-eye-left';
            ghost.appendChild(eyeLeft);

            const eyeRight = document.createElement('div');
            eyeRight.className = 'ghost-eye ghost-eye-right';
            ghost.appendChild(eyeRight);

            // Add pupils
            const pupilLeft = document.createElement('div');
            pupilLeft.className = 'ghost-pupil';
            pupilLeft.style.left = '2px';
            eyeLeft.appendChild(pupilLeft);

            const pupilRight = document.createElement('div');
            pupilRight.className = 'ghost-pupil';
            pupilRight.style.left = '2px';
            eyeRight.appendChild(pupilRight);

            gameContainer.appendChild(ghost);

            // Random direction and speed for ghosts
            const ghostObj = {
                element: ghost,
                x: x,
                y: y,
                direction: Math.floor(Math.random() * 4),
                speed: 1 + Math.random() * 1,
                changeDirectionTime: 0
            };

            ghosts.push(ghostObj);
        }

        function clearGhosts() {
            ghosts.forEach(ghost => {
                if (ghost.element.parentNode) {
                    ghost.element.parentNode.removeChild(ghost.element);
                }
            });
            ghosts = [];
        }

        function updateGame() {
            if (!gameActive) return;

            // Move player
            const keys = {
                ArrowUp: 3,
                ArrowRight: 0,
                ArrowDown: 1,
                ArrowLeft: 2
            };

            document.onkeydown = function (e) {
                if (keys[e.key] !== undefined) {
                    playerDirection = keys[e.key];
                }
            };

            // Move based on direction
            const moveX = [playerSpeed, 0, -playerSpeed, 0];
            const moveY = [0, playerSpeed, 0, -playerSpeed];

            playerX += moveX[playerDirection];
            playerY += moveY[playerDirection];

            // Boundary check
            playerX = Math.max(0, Math.min(gameContainer.clientWidth - 20, playerX));
            playerY = Math.max(0, Math.min(gameContainer.clientHeight - 20, playerY));

            updatePlayerPosition();

            // Move ghosts
            ghosts.forEach(ghost => {
                // Change direction occasionally
                ghost.changeDirectionTime++;
                if (ghost.changeDirectionTime > 100) {
                    ghost.direction = Math.floor(Math.random() * 4);
                    ghost.changeDirectionTime = 0;
                }

                // Move ghost
                const ghostMoveX = [ghost.speed, 0, -ghost.speed, 0];
                const ghostMoveY = [0, ghost.speed, 0, -ghost.speed];

                ghost.x += ghostMoveX[ghost.direction];
                ghost.y += ghostMoveY[ghost.direction];

                // Boundary check and bounce
                if (ghost.x <= 0 || ghost.x >= gameContainer.clientWidth - 20) {
                    ghost.direction = ghost.direction === 0 ? 2 : 0;
                }
                if (ghost.y <= 0 || ghost.y >= gameContainer.clientHeight - 20) {
                    ghost.direction = ghost.direction === 1 ? 3 : 1;
                }

                ghost.x = Math.max(0, Math.min(gameContainer.clientWidth - 20, ghost.x));
                ghost.y = Math.max(0, Math.min(gameContainer.clientHeight - 20, ghost.y));

                ghost.element.style.left = `${ghost.x}px`;
                ghost.element.style.top = `${ghost.y}px`;

                // Check collision with player
                if (checkCollision(
                    playerX, playerY, 20, 20,
                    ghost.x, ghost.y, 20, 20
                )) {
                    endGame();
                }
            });

            // Check for food collision
            foods.forEach((food, index) => {
                if (checkCollision(
                    playerX, playerY, 20, 20,
                    parseFloat(food.element.style.left), parseFloat(food.element.style.top), 6, 6
                )) {
                    // Eat food
                    gameContainer.removeChild(food.element);
                    foods.splice(index, 1);
                    score++;
                    gameScore.textContent = `SCORE: ${score}`;

                    // Add new food if eaten
                    if (Math.random() > 0.5) {
                        createFood();
                    }
                }
            });

            // Check win condition
            if (foods.length === 0) {
                endGame(true);
            }
        }

        function checkCollision(x1, y1, w1, h1, x2, y2, w2, h2) {
            return !(
                x1 + w1 < x2 ||
                x2 + w2 < x1 ||
                y1 + h1 < y2 ||
                y2 + h2 < y1
            );
        }

        function endGame(win = false) {
            gameActive = false;
            clearInterval(gameLoop);

            gameOver.textContent = win ? `勝利! スコア: ${score}` : `ゲームオーバー! スコア: ${score}`;
            gameOver.style.color = win ? '#44b3ff' : 'red';
            gameOver.style.display = 'flex';

            setTimeout(() => {
                gameOver.style.display = 'none';
                playButton.style.display = 'inline-block';
                gameContainer.style.display = 'none';
            }, 3000);
        }

        // Touch controls for mobile
        let touchX, touchY;

        gameContainer.addEventListener('touchstart', function (e) {
            e.preventDefault();
            const touch = e.touches[0];
            touchX = touch.clientX;
            touchY = touch.clientY;
        });

        gameContainer.addEventListener('touchmove', function (e) {
            if (!gameActive) return;
            e.preventDefault();

            const touch = e.touches[0];
            const deltaX = touch.clientX - touchX;
            const deltaY = touch.clientY - touchY;

            // Determine direction based on which delta is larger
            if (Math.abs(deltaX) > Math.abs(deltaY)) {
                playerDirection = deltaX > 0 ? 0 : 2;
            } else {
                playerDirection = deltaY > 0 ? 1 : 3;
            }

            touchX = touch.clientX;
            touchY = touch.clientY;
        });

        // Initialize game
        playButton.addEventListener('click', startGame);
    });
</script>
</body>

</html>
