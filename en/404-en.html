    <title>Houston, We Have a Problem - 404</title>
    <script>
        // GitHub Pages language detection for 404 pages
        (function () {
            // Skip redirection if we're already on the correct 404 page
            if (window.location.pathname.endsWith('/404-en.html')) {
                return;
            }

            // Get the current path
            var path = window.location.pathname.toLowerCase();
            var redirectUrl = '';
            var shouldRedirect = false;

            // Check if we're in a non-English context
            if (!(path.match(/\/en\//i) || path.match(/\/en-.*\.html$/i) || path.match(/\/.*-en\.html$/i))) {
                if (path.match(/\/it\//i) || path.match(/\/it-.*\.html$/i) || path.match(/\/.*-it\.html$/i)) {
                    redirectUrl = '/it/404-it.html';
                    shouldRedirect = true;
                } else if (path.match(/\/jp\//i) || path.match(/\/jp-.*\.html$/i) || path.match(/\/.*-jp\.html$/i)) {
                    redirectUrl = '/jp/404-jp.html';
                    shouldRedirect = true;
                } else {
                    // Default to Chinese for unrecognized paths
                    redirectUrl = '/404.html';
                    shouldRedirect = true;
                }
            }

            // Redirect if needed
            if (shouldRedirect && redirectUrl) {
                // Handle potential GitHub Pages project path
                var projectPath = '';
                var hostParts = window.location.hostname.split('.');
                if (hostParts[0] !== 'localhost' &&
                    !(hostParts[1] === 'github' && hostParts[2] === 'io') &&
                    window.location.pathname.split('/')[1]) {
                    projectPath = '/' + window.location.pathname.split('/')[1];
                }

                window.location.replace(projectPath + redirectUrl);
            }
        })();
    </script>

        }

        #gameScore {

    <h1>404</h1>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const playButton = document.getElementById('playButton');
        const gameContainer = document.getElementById('gameContainer');
        const gameControls = document.getElementById('gameControls');
        const restartButton = document.getElementById('restartButton');
        const spaceship = document.getElementById('spaceship');
        const gameScore = document.getElementById('gameScore');
        const gameMessage = document.getElementById('gameMessage');

        let score = 0;
        let gameActive = false;
        let spaceshipX = gameContainer.clientWidth / 2 - 20;
        let asteroids = [];
        let gameLoop;

        function startGame() {
            playButton.style.display = 'none';
            gameContainer.style.display = 'block';
            gameControls.style.display = 'block';
            gameActive = true;
            score = 0;
            gameScore.textContent = 'Score: ' + score;
            gameMessage.style.display = 'none';

            spaceship.style.left = spaceshipX + 'px';

            // Clear any existing asteroids
            asteroids.forEach(asteroid => {
                if (asteroid.element && asteroid.element.parentNode) {
                    asteroid.element.parentNode.removeChild(asteroid.element);
                }
            });
            asteroids = [];

            // Start game loop
            clearInterval(gameLoop);
            gameLoop = setInterval(updateGame, 20);

            // Start creating asteroids
            createAsteroid();
        }

        function createAsteroid() {
            if (!gameActive) return;

            const asteroid = document.createElement('div');
            asteroid.className = 'asteroid';
            asteroid.style.left = Math.random() * (gameContainer.clientWidth - 20) + 'px';
            gameContainer.appendChild(asteroid);

            const asteroidObj = {
                element: asteroid,
                x: parseFloat(asteroid.style.left),
                y: -20,
                speed: 2 + Math.random() * 3
            };

            asteroids.push(asteroidObj);

            // Schedule next asteroid
            setTimeout(createAsteroid, 1000 + Math.random() * 1000);
        }

        function updateGame() {
            if (!gameActive) return;

            // Move asteroids
            asteroids.forEach((asteroid, index) => {
                asteroid.y += asteroid.speed;
                asteroid.element.style.top = asteroid.y + 'px';

                // Check if asteroid is off screen
                if (asteroid.y > gameContainer.clientHeight) {
                    gameContainer.removeChild(asteroid.element);
                    asteroids.splice(index, 1);
                    score++;
                    gameScore.textContent = 'Score: ' + score;
                }

                // Check collision
                if (checkCollision(asteroid)) {
                    endGame();
                }
            });
        }

        function checkCollision(asteroid) {
            const shipRect = spaceship.getBoundingClientRect();
            const asteroidRect = asteroid.element.getBoundingClientRect();

            return !(
                shipRect.right < asteroidRect.left ||
                shipRect.left > asteroidRect.right ||
                shipRect.bottom < asteroidRect.top ||
                shipRect.top > asteroidRect.bottom
            );
        }

        function endGame() {
            gameActive = false;
            clearInterval(gameLoop);
            gameMessage.textContent = 'Game Over! Score: ' + score;
            gameMessage.style.display = 'block';
        }

        // Control handlers
        document.addEventListener('keydown', function (event) {
            if (!gameActive) return;

            const SHIP_SPEED = 10;
            const containerWidth = gameContainer.clientWidth;

            if (event.key === 'ArrowLeft') {
                spaceshipX = Math.max(0, spaceshipX - SHIP_SPEED);
            } else if (event.key === 'ArrowRight') {
                spaceshipX = Math.min(containerWidth - 40, spaceshipX + SHIP_SPEED);
            }

            spaceship.style.left = spaceshipX + 'px';
        });

        // Touch controls
        let touchStartX = 0;

        gameContainer.addEventListener('touchstart', function (event) {
            if (!gameActive) return;
            touchStartX = event.touches[0].clientX;
        });

        gameContainer.addEventListener('touchmove', function (event) {
            if (!gameActive) return;

            event.preventDefault();
            const touchX = event.touches[0].clientX;
            const deltaX = touchX - touchStartX;
            touchStartX = touchX;

            spaceshipX = Math.max(0, Math.min(gameContainer.clientWidth - 40, spaceshipX + deltaX));
            spaceship.style.left = spaceshipX + 'px';
        });

        // Button handlers
        playButton.addEventListener('click', startGame);
        restartButton.addEventListener('click', startGame);
    });
</script>

<script>
    // Ensure this page is shown in the correct language context
    document.addEventListener('DOMContentLoaded', function () {
        const currentPath = window.location.pathname.toLowerCase();
        let shouldRedirect = false;
        let redirectUrl = '';

        // If we're in a non-English context but viewing the English 404 page
        if (currentPath.includes('/zh-CN/') ||
            (!currentPath.includes('/en/') && !currentPath.includes('-en.html') &&
                !currentPath.includes('/it/') && !currentPath.includes('-it.html') &&
                !currentPath.includes('/jp/') && !currentPath.includes('-jp.html'))) {
            shouldRedirect = true;
            redirectUrl = '/404.html'; // Default Chinese
        } else if (currentPath.includes('/it/') || currentPath.match(/\/(.*-it)\.html$/)) {
            shouldRedirect = true;
            redirectUrl = '/it/404-it.html';
        } else if (currentPath.includes('/jp/') || currentPath.match(/\/(.*-jp)\.html$/)) {
            shouldRedirect = true;
            redirectUrl = '/jp/404-jp.html';
        }

        if (shouldRedirect && redirectUrl) {
            window.location.href = redirectUrl;
        }
    });
</script>
