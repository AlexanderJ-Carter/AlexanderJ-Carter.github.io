# Folio production compose — values come from .env.production（实例文件，不入库）
services:
  folio:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://127.0.0.1:3000}
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-Folio}
        NEXT_PUBLIC_SITE_MARK: ${NEXT_PUBLIC_SITE_MARK:-FO}
        NEXT_PUBLIC_OIDC_LOGIN_URL: ${NEXT_PUBLIC_OIDC_LOGIN_URL:-/api/oidc/login}
        NEXT_PUBLIC_OIDC_DISPLAY_HOST: ${NEXT_PUBLIC_OIDC_DISPLAY_HOST:-}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    image: folio:local
    container_name: folio
    restart: unless-stopped
    ports:
      # 须 docker compose --env-file .env.production …，否则默认只绑 127.0.0.1
      # 例: FOLIO_PUBLISH=100.x.x.x:3040（Tailscale，供 cloud Nginx 反代）
      - "${FOLIO_PUBLISH:-127.0.0.1:3040}:3000"
    env_file:
      - .env.production
    volumes:
      - folio-data:/app/data
      - folio-media:/app/public/media
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    mem_limit: 768m
    memswap_limit: 1024m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  # 宿主机运维：配置导航 / 联系表单（读同一 SQLite 卷）
  #   docker compose -f compose.prod.yaml --profile ops run --rm folio-ops scripts/configure-nav.mjs
  #   docker compose -f compose.prod.yaml --profile ops run --rm folio-ops scripts/configure-contact-form.mjs
  folio-ops:
    profiles: ['ops']
    image: node:22.17.0-bookworm-slim
    working_dir: /app
    env_file:
      - .env.production
    environment:
      DATABASE_URL: file:/app/data/folio.db
    volumes:
      - .:/app
      - folio-data:/app/data
      - folio-media:/app/public/media
    entrypoint: ['node', '--import', 'tsx']

volumes:
  folio-data:
  folio-media:
