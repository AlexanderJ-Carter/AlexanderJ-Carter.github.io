# Folio on tencent (Tailscale bind). Proxied from cloud nginx → www.alexander.xin
services:
  folio:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SERVER_URL: https://www.alexander.xin
        NEXT_PUBLIC_OIDC_LOGIN_URL: /api/oidc/login
    image: folio:local
    container_name: folio
    restart: unless-stopped
    ports:
      - "100.111.222.66:3040:3000"
    env_file:
      - .env.production
    volumes:
      - folio-data:/app/data
      - folio-media:/app/public/media
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    mem_limit: 768m
    memswap_limit: 1024m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  folio-data:
  folio-media:
