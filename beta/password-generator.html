<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beta密码生成器</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .generator-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            max-width: 500px;
            width: 100%;
            margin: 20px;
        }
        .generator-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .generator-header h2 {
            color: #333;
            margin-bottom: 10px;
        }
        .generator-header p {
            color: #666;
            font-size: 14px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 15px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        .output {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            word-break: break-all;
        }
        .copy-btn {
            background: #28a745;
            font-size: 14px;
            padding: 8px 16px;
            margin-top: 10px;
        }
        .instructions {
            background: #e7f3ff;
            border-left: 4px solid #0066cc;
            padding: 15px;
            margin-top: 20px;
            border-radius: 5px;
        }
        .instructions h4 {
            margin-top: 0;
            color: #0066cc;
        }
        .instructions ol {
            margin: 10px 0 0 20px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="generator-card">
        <div class="generator-header">
            <h2>🔐 Beta密码生成器</h2>
            <p>为您的Beta区域生成安全的哈希密码</p>
        </div>
        
        <div class="input-group">
            <label for="password-input">输入您想要的密码:</label>
            <input type="text" id="password-input" placeholder="例如: mybetapassword123">
        </div>
        
        <button class="btn" onclick="generateHash()">生成哈希</button>
        
        <div id="output-section" style="display: none;">
            <div class="output">
                <strong>SHA-256 哈希值:</strong><br>
                <span id="hash-output"></span>
                <button class="btn copy-btn" onclick="copyHash()">复制哈希</button>
            </div>
        </div>
        
        <div class="instructions">
            <h4>使用说明:</h4>
            <ol>
                <li>输入您想要设置的密码</li>
                <li>点击"生成哈希"按钮</li>
                <li>复制生成的哈希值</li>
                <li>将哈希值添加到 beta-auth.js 中的 validHashes 数组</li>
                <li>用户输入原密码即可通过验证</li>
            </ol>
            <p><strong>安全性:</strong> 即使别人看到JavaScript代码，也无法从哈希值反推出原密码！</p>
        </div>
    </div>

    <script>
        async function generateHash() {
            const password = document.getElementById('password-input').value.trim();
            
            if (!password) {
                alert('请输入密码！');
                return;
            }
            
            try {
                // 使用Web Crypto API生成SHA-256哈希
                const encoder = new TextEncoder();
                const data = encoder.encode(password);
                const hashBuffer = await crypto.subtle.digest('SHA-256', data);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
                
                document.getElementById('hash-output').textContent = hashHex;
                document.getElementById('output-section').style.display = 'block';
                
                console.log(`密码 "${password}" 的哈希值: ${hashHex}`);
            } catch (error) {
                alert('生成哈希时出错：' + error.message);
            }
        }
        
        function copyHash() {
            const hashText = document.getElementById('hash-output').textContent;
            
            if (navigator.clipboard) {
                navigator.clipboard.writeText(hashText).then(() => {
                    alert('哈希值已复制到剪贴板！');
                });
            } else {
                // 兼容旧浏览器
                const textArea = document.createElement('textarea');
                textArea.value = hashText;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                alert('哈希值已复制到剪贴板！');
            }
        }
        
        // 回车键快捷生成
        document.getElementById('password-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                generateHash();
            }
        });
    </script>
</body>
</html>
