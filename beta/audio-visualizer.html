<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 音频可视化器 - Beta特别版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .visualizer-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        canvas {
            border-radius: 20px;
            background: radial-gradient(circle at center, #1a1a2e, #16213e, #0f3460);
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.1);
        }

        .controls {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 15px;
            padding: 20px;
            color: white;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .control-group {
            margin: 10px 0;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        input[type="file"] {
            display: none;
        }

        .file-label {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            font-size: 14px;
        }

        .file-label:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3);
        }

        .btn {
            background: linear-gradient(45deg, #2196F3, #1976D2);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            margin: 0 5px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(33, 150, 243, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn.danger {
            background: linear-gradient(45deg, #f44336, #d32f2f);
        }

        .btn.danger:hover {
            box-shadow: 0 5px 15px rgba(244, 67, 54, 0.3);
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="range"] {
            width: 100px;
            height: 5px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.3);
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #4CAF50;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        input[type="range"]::-moz-range-thumb {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #4CAF50;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        .visualization-modes {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .mode-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .mode-btn.active {
            background: linear-gradient(45deg, #FF6B6B, #ee5a52);
            border-color: #FF6B6B;
        }

        .mode-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        .info-text {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 10px;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }

        .pulsing {
            animation: pulse 2s infinite;
        }
    </style>
</head>

<body>
    <div class="visualizer-container">
        <canvas id="visualizerCanvas" width="800" height="400"></canvas>

        <div class="controls">
            <div class="control-group">
                <label for="audioFile" class="file-label">
                    🎵 选择音频文件
                </label>
                <input type="file" id="audioFile" accept="audio/*">

                <button class="btn" id="playBtn" disabled>▶️ 播放</button>
                <button class="btn" id="pauseBtn" disabled>⏸️ 暂停</button>
                <button class="btn danger" id="stopBtn" disabled>⏹️ 停止</button>
            </div>

            <div class="control-group">
                <div class="volume-control">
                    <span>🔊</span>
                    <input type="range" id="volumeSlider" min="0" max="100" value="50">
                    <span id="volumeValue">50%</span>
                </div>
            </div>

            <div class="control-group">
                <span>可视化模式:</span>
                <div class="visualization-modes">
                    <button class="mode-btn active" data-mode="bars">频谱条</button>
                    <button class="mode-btn" data-mode="circle">圆形波</button>
                    <button class="mode-btn" data-mode="wave">波形图</button>
                    <button class="mode-btn" data-mode="particles">粒子效果</button>
                </div>
            </div>

            <div class="info-text">
                支持 MP3, WAV, OGG 等音频格式 | 按空格键暂停/播放
            </div>
        </div>

        <button class="back-btn" onclick="window.location.href='beta-dashboard.html'">
            🏠 返回主页
        </button>
    </div>

    <script>
        class AudioVisualizer {
            constructor() {
                this.canvas = document.getElementById('visualizerCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.audio = new Audio();
                this.audioContext = null;
                this.analyser = null;
                this.source = null;
                this.dataArray = null;
                this.bufferLength = 0;
                this.animationId = null;
                this.isPlaying = false;
                this.currentMode = 'bars';
                this.particles = [];

                this.initEventListeners();
                this.setupCanvas();
                this.startIdleAnimation();
            }

            initEventListeners() {
                const fileInput = document.getElementById('audioFile');
                const playBtn = document.getElementById('playBtn');
                const pauseBtn = document.getElementById('pauseBtn');
                const stopBtn = document.getElementById('stopBtn');
                const volumeSlider = document.getElementById('volumeSlider');
                const volumeValue = document.getElementById('volumeValue');
                const modeButtons = document.querySelectorAll('.mode-btn');

                fileInput.addEventListener('change', (e) => this.loadAudioFile(e));
                playBtn.addEventListener('click', () => this.play());
                pauseBtn.addEventListener('click', () => this.pause());
                stopBtn.addEventListener('click', () => this.stop());

                volumeSlider.addEventListener('input', (e) => {
                    const volume = e.target.value / 100;
                    this.audio.volume = volume;
                    volumeValue.textContent = e.target.value + '%';
                });

                modeButtons.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        modeButtons.forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        this.currentMode = e.target.dataset.mode;
                    });
                });

                // 键盘控制
                document.addEventListener('keydown', (e) => {
                    if (e.code === 'Space') {
                        e.preventDefault();
                        if (this.isPlaying) {
                            this.pause();
                        } else {
                            this.play();
                        }
                    }
                });

                // 音频事件
                this.audio.addEventListener('loadedmetadata', () => {
                    playBtn.disabled = false;
                });

                this.audio.addEventListener('ended', () => {
                    this.stop();
                });
            }

            setupCanvas() {
                // 响应式画布
                const resizeCanvas = () => {
                    const container = this.canvas.parentElement;
                    const maxWidth = Math.min(window.innerWidth - 40, 1000);
                    const maxHeight = Math.min(window.innerHeight - 200, 500);

                    this.canvas.width = maxWidth;
                    this.canvas.height = maxHeight;
                };

                resizeCanvas();
                window.addEventListener('resize', resizeCanvas);
            }

            async loadAudioFile(event) {
                const file = event.target.files[0];
                if (!file) return;

                try {
                    // 创建音频上下文
                    if (!this.audioContext) {
                        this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                        this.analyser = this.audioContext.createAnalyser();
                        this.analyser.fftSize = 256;
                        this.bufferLength = this.analyser.frequencyBinCount;
                        this.dataArray = new Uint8Array(this.bufferLength);
                    }

                    // 加载音频文件
                    const url = URL.createObjectURL(file);
                    this.audio.src = url;

                    // 连接音频源
                    if (this.source) {
                        this.source.disconnect();
                    }

                    this.source = this.audioContext.createMediaElementSource(this.audio);
                    this.source.connect(this.analyser);
                    this.analyser.connect(this.audioContext.destination);

                    // 初始化粒子
                    this.initParticles();

                    this.showMessage('🎵 音频文件加载成功！', 'success');
                } catch (error) {
                    console.error('加载音频文件失败:', error);
                    this.showMessage('❌ 加载音频文件失败', 'error');
                }
            }

            play() {
                if (this.audioContext && this.audioContext.state === 'suspended') {
                    this.audioContext.resume();
                }

                this.audio.play().then(() => {
                    this.isPlaying = true;
                    this.updateControls();
                    this.startVisualization();
                }).catch(error => {
                    console.error('播放失败:', error);
                    this.showMessage('❌ 播放失败', 'error');
                });
            }

            pause() {
                this.audio.pause();
                this.isPlaying = false;
                this.updateControls();
            }

            stop() {
                this.audio.pause();
                this.audio.currentTime = 0;
                this.isPlaying = false;
                this.updateControls();
                if (this.animationId) {
                    cancelAnimationFrame(this.animationId);
                    this.animationId = null;
                }
                this.clearCanvas();
                this.startIdleAnimation();
            }

            updateControls() {
                const playBtn = document.getElementById('playBtn');
                const pauseBtn = document.getElementById('pauseBtn');
                const stopBtn = document.getElementById('stopBtn');

                playBtn.disabled = this.isPlaying;
                pauseBtn.disabled = !this.isPlaying;
                stopBtn.disabled = !this.audio.src;
            }

            startVisualization() {
                if (!this.analyser || !this.isPlaying) return;

                const animate = () => {
                    if (!this.isPlaying) return;

                    this.analyser.getByteFrequencyData(this.dataArray);
                    this.clearCanvas();

                    switch (this.currentMode) {
                        case 'bars':
                            this.drawBars();
                            break;
                        case 'circle':
                            this.drawCircle();
                            break;
                        case 'wave':
                            this.drawWave();
                            break;
                        case 'particles':
                            this.drawParticles();
                            break;
                    }

                    this.animationId = requestAnimationFrame(animate);
                };

                animate();
            }

            drawBars() {
                const barWidth = (this.canvas.width / this.bufferLength) * 2.5;
                let barHeight;
                let x = 0;

                for (let i = 0; i < this.bufferLength; i++) {
                    barHeight = (this.dataArray[i] / 255) * this.canvas.height * 0.8;

                    // 彩虹渐变
                    const hue = (i / this.bufferLength) * 360;
                    this.ctx.fillStyle = `hsl(${hue}, 70%, 60%)`;

                    // 添加发光效果
                    this.ctx.shadowColor = `hsl(${hue}, 70%, 60%)`;
                    this.ctx.shadowBlur = 10;

                    this.ctx.fillRect(x, this.canvas.height - barHeight, barWidth, barHeight);

                    x += barWidth + 1;
                }

                this.ctx.shadowBlur = 0;
            }

            drawCircle() {
                const centerX = this.canvas.width / 2;
                const centerY = this.canvas.height / 2;
                const radius = Math.min(centerX, centerY) * 0.7;

                this.ctx.lineWidth = 2;

                for (let i = 0; i < this.bufferLength; i++) {
                    const angle = (i / this.bufferLength) * Math.PI * 2;
                    const amplitude = (this.dataArray[i] / 255) * 100;

                    const x1 = centerX + Math.cos(angle) * radius;
                    const y1 = centerY + Math.sin(angle) * radius;
                    const x2 = centerX + Math.cos(angle) * (radius + amplitude);
                    const y2 = centerY + Math.sin(angle) * (radius + amplitude);

                    const hue = (i / this.bufferLength) * 360;
                    this.ctx.strokeStyle = `hsl(${hue}, 70%, 60%)`;

                    this.ctx.beginPath();
                    this.ctx.moveTo(x1, y1);
                    this.ctx.lineTo(x2, y2);
                    this.ctx.stroke();
                }
            }

            drawWave() {
                this.ctx.lineWidth = 3;
                this.ctx.beginPath();

                const sliceWidth = this.canvas.width / this.bufferLength;
                let x = 0;

                for (let i = 0; i < this.bufferLength; i++) {
                    const v = this.dataArray[i] / 128.0;
                    const y = v * this.canvas.height / 2;

                    if (i === 0) {
                        this.ctx.moveTo(x, y);
                    } else {
                        this.ctx.lineTo(x, y);
                    }

                    x += sliceWidth;
                }

                // 渐变描边
                const gradient = this.ctx.createLinearGradient(0, 0, this.canvas.width, 0);
                gradient.addColorStop(0, '#ff6b6b');
                gradient.addColorStop(0.5, '#4ecdc4');
                gradient.addColorStop(1, '#45b7d1');

                this.ctx.strokeStyle = gradient;
                this.ctx.stroke();
            }

            initParticles() {
                this.particles = [];
                for (let i = 0; i < 100; i++) {
                    this.particles.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        vx: (Math.random() - 0.5) * 2,
                        vy: (Math.random() - 0.5) * 2,
                        size: Math.random() * 3 + 1,
                        hue: Math.random() * 360
                    });
                }
            }

            drawParticles() {
                // 更新粒子位置
                this.particles.forEach((particle, index) => {
                    const audioValue = this.dataArray[index % this.bufferLength] / 255;

                    particle.x += particle.vx * (1 + audioValue * 2);
                    particle.y += particle.vy * (1 + audioValue * 2);
                    particle.size = (audioValue * 5) + 1;

                    // 边界检测
                    if (particle.x < 0 || particle.x > this.canvas.width) particle.vx *= -1;
                    if (particle.y < 0 || particle.y > this.canvas.height) particle.vy *= -1;

                    // 绘制粒子
                    this.ctx.beginPath();
                    this.ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                    this.ctx.fillStyle = `hsl(${particle.hue + audioValue * 60}, 70%, 60%)`;
                    this.ctx.shadowColor = this.ctx.fillStyle;
                    this.ctx.shadowBlur = 10;
                    this.ctx.fill();
                });

                this.ctx.shadowBlur = 0;
            }

            startIdleAnimation() {
                const animate = () => {
                    if (this.isPlaying) return;

                    this.clearCanvas();

                    // 绘制空闲状态的波形
                    const time = Date.now() * 0.001;
                    this.ctx.lineWidth = 2;

                    const gradient = this.ctx.createLinearGradient(0, 0, this.canvas.width, 0);
                    gradient.addColorStop(0, 'rgba(255, 107, 107, 0.5)');
                    gradient.addColorStop(0.5, 'rgba(78, 205, 196, 0.5)');
                    gradient.addColorStop(1, 'rgba(69, 183, 209, 0.5)');

                    this.ctx.strokeStyle = gradient;
                    this.ctx.beginPath();

                    for (let x = 0; x < this.canvas.width; x += 5) {
                        const y = this.canvas.height / 2 +
                            Math.sin((x * 0.01) + time) * 30 +
                            Math.sin((x * 0.02) + time * 1.5) * 15;

                        if (x === 0) {
                            this.ctx.moveTo(x, y);
                        } else {
                            this.ctx.lineTo(x, y);
                        }
                    }

                    this.ctx.stroke();

                    // 显示提示文字
                    this.ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                    this.ctx.font = '24px Segoe UI';
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText('🎵 选择音频文件开始可视化', this.canvas.width / 2, this.canvas.height / 2 + 80);

                    if (!this.isPlaying) {
                        requestAnimationFrame(animate);
                    }
                };

                animate();
            }

            clearCanvas() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
            }

            showMessage(message, type) {
                const toast = document.createElement('div');
                toast.style.cssText = `
                    position: fixed;
                    top: 20px;
                    left: 50%;
                    transform: translateX(-50%);
                    background: ${type === 'success' ? '#4CAF50' : '#f44336'};
                    color: white;
                    padding: 15px 25px;
                    border-radius: 10px;
                    z-index: 10000;
                    font-size: 14px;
                    animation: slideDown 0.3s ease;
                `;
                toast.textContent = message;
                document.body.appendChild(toast);

                setTimeout(() => {
                    toast.style.animation = 'slideUp 0.3s ease forwards';
                    setTimeout(() => toast.remove(), 300);
                }, 2000);
            }
        }

        // 添加动画样式
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideDown {
                from { transform: translateX(-50%) translateY(-100%); opacity: 0; }
                to { transform: translateX(-50%) translateY(0); opacity: 1; }
            }
            @keyframes slideUp {
                from { transform: translateX(-50%) translateY(0); opacity: 1; }
                to { transform: translateX(-50%) translateY(-100%); opacity: 0; }
            }
        `;
        document.head.appendChild(style);

        // 初始化可视化器
        document.addEventListener('DOMContentLoaded', () => {
            new AudioVisualizer();
        });
    </script>
</body>

</html>
