name: Auto Tag and Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump strategy when no tag exists on current commit'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      tag:
        description: 'Optional explicit tag (example: v3.1.0). If set, bump is ignored.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: auto-release-main
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || ((startsWith(github.event.head_commit.message, 'release:') || contains(github.event.head_commit.message, '[release]')) && !contains(github.event.head_commit.message, '[skip release]')) }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify build
        run: npm run build

      - name: Resolve release tag
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BUMP: ${{ github.event.inputs.bump || 'patch' }}
          INPUT_TAG: ${{ github.event.inputs.tag || '' }}
        run: |
          set -euo pipefail

          manual_tag="${INPUT_TAG}"
          if [[ -n "${manual_tag}" ]]; then
            if [[ ! "${manual_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid manual tag: ${manual_tag}. Expected format: vMAJOR.MINOR.PATCH"
              exit 1
            fi

            if git rev-parse "${manual_tag}" >/dev/null 2>&1; then
              echo "tag=${manual_tag}" >> "$GITHUB_OUTPUT"
              echo "created=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "tag=${manual_tag}" >> "$GITHUB_OUTPUT"
            echo "created=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          existing_tag=$(git tag --points-at HEAD 'v*' | sort -V | tail -n 1 || true)
          if [[ -n "${existing_tag}" ]]; then
            echo "tag=${existing_tag}" >> "$GITHUB_OUTPUT"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_tag=$(git tag --list 'v*' --sort=-version:refname | head -n 1 || true)
          bump="${INPUT_BUMP}"

          if [[ -z "${latest_tag}" ]]; then
            next_tag="v0.1.0"
          else
            version="${latest_tag#v}"
            IFS='.' read -r major minor patch <<< "${version}"
            major="${major:-0}"
            minor="${minor:-0}"
            patch="${patch:-0}"

            case "${bump}" in
              major)
                major=$((major + 1))
                minor=0
                patch=0
                ;;
              minor)
                minor=$((minor + 1))
                patch=0
                ;;
              patch|*)
                patch=$((patch + 1))
                ;;
            esac

            next_tag="v${major}.${minor}.${patch}"
          fi

          echo "tag=${next_tag}" >> "$GITHUB_OUTPUT"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        if: steps.version.outputs.created == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "release: ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Check release existence
        id: release_check
        uses: actions/github-script@v9
        with:
          script: |
            const tag = '${{ steps.version.outputs.tag }}';
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              core.setOutput('exists', 'true');
            } catch (error) {
              if (error.status === 404) {
                core.setOutput('exists', 'false');
              } else {
                throw error;
              }
            }

      - name: Create GitHub release
        if: steps.release_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          target_commitish: ${{ github.sha }}