name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=moderate --omit=dev

      - name: Detect changed files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            **/*.astro
            **/*.css
            **/*.js
            **/*.mjs
            **/*.ts
            **/*.json
            **/*.md
            **/*.yml
            **/*.yaml

      - name: Lint code
        if: steps.changed-files.outputs.any_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          files="${{ steps.changed-files.outputs.all_changed_files }}"
          echo "Checking files with Prettier:"
          printf '%s\n' $files
          npx prettier --check $files

      - name: Skip lint when no relevant changes
        if: steps.changed-files.outputs.any_changed != 'true'
        run: echo "No files requiring Prettier check in this run."

      - name: Type check
        run: npx astro check

      - name: Build site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
