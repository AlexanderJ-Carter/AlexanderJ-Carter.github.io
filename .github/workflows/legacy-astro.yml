name: Legacy Astro (manual only)

# Astro 根站已退役。仅在需要核对迁移源时手动跑；不再作为 PR 门禁。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-astro-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  legacy-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Legacy Astro build
        run: npm run legacy:build
