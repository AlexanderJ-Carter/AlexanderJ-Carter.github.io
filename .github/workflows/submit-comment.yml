name: Submit Blog Comment

on:
  workflow_dispatch:
    inputs:
      article_id:
        description: "文章ID"
        required: true
      name:
        description: "评论者姓名"
        required: true
      email:
        description: "评论者邮箱"
        required: true
      comment:
        description: "评论内容"
        required: true

jobs:
  create-comment-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Create comment issue
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { article_id, name, email, comment } = context.payload.inputs;

            // 创建评论issue
            const response = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: 'blog-comments',  // 存储评论的仓库名称
              title: `Comment on ${article_id} by ${name}`,
              body: `
              **评论者**: ${name}
              **电子邮件**: ${email}
              **文章**: ${article_id}
              **日期**: ${new Date().toLocaleString("zh-CN")}
              
              ---
              
              ${comment}
              `,
              labels: ['comment', article_id]
            });

            console.log(`创建评论issue成功: ${response.data.html_url}`);

            return {
              issueUrl: response.data.html_url,
              issueNumber: response.data.number
            };
