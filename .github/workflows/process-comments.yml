name: Process Blog Comments

on:
  issues:
    types: [opened, edited]

jobs:
  process-comments:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'comment')
    steps:
      - name: Comment on issue
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;

            // 确认收到评论
            await github.rest.issues.createComment({
              issue_number: issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '感谢您的评论！评论已收到，等待管理员审核。'
            });

            // 如果需要，可以添加更多处理逻辑

  process-subscriptions:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'subscription')
    steps:
      - name: Comment on subscription
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;

            // 确认收到订阅请求
            await github.rest.issues.createComment({
              issue_number: issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '感谢您的订阅！您的邮箱已被添加到订阅列表。'
            });

            // 可以添加更多处理逻辑，例如导出邮件列表等
