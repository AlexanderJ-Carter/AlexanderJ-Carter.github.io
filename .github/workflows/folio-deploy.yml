name: Deploy Folio (Tencent)

on:
  push:
    branches: [main]
    paths:
      - 'folio/**'
      - '.github/workflows/folio-deploy.yml'
  workflow_dispatch:

concurrency:
  group: folio-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ secrets.FOLIO_SSH_PRIVATE_KEY != '' && secrets.FOLIO_SSH_HOST != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.FOLIO_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.FOLIO_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Rsync Folio to server
        env:
          HOST: ${{ secrets.FOLIO_SSH_HOST }}
          USER: ${{ secrets.FOLIO_SSH_USER }}
          REMOTE: ${{ secrets.FOLIO_REMOTE_PATH }}
        run: |
          USER="${USER:-ubuntu}"
          REMOTE="${REMOTE:-/home/ubuntu/folio}"
          rsync -az --delete \
            --exclude node_modules \
            --exclude .next \
            --exclude .git \
            --exclude data \
            --exclude public/media \
            --exclude .env \
            --exclude .env.production \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new" \
            ./folio/ "${USER}@${HOST}:${REMOTE}/"

      - name: Build and restart containers
        env:
          HOST: ${{ secrets.FOLIO_SSH_HOST }}
          USER: ${{ secrets.FOLIO_SSH_USER }}
          REMOTE: ${{ secrets.FOLIO_REMOTE_PATH }}
        run: |
          USER="${USER:-ubuntu}"
          REMOTE="${REMOTE:-/home/ubuntu/folio}"
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
            "${USER}@${HOST}" \
            "cd '${REMOTE}' && docker compose -f compose.prod.yaml build && docker compose -f compose.prod.yaml up -d"

      - name: Purge Cloudflare cache
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ZONE_ID" ]; then
            echo "Cloudflare purge skipped (secrets not set)."
            exit 0
          fi
          response=$(curl -sS -w "\nHTTP_CODE:%{http_code}" -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "$response"
          echo "$response" | grep -q 'HTTP_CODE:200' || exit 1

  skip-notice:
    runs-on: ubuntu-latest
    if: ${{ secrets.FOLIO_SSH_PRIVATE_KEY == '' || secrets.FOLIO_SSH_HOST == '' }}
    steps:
      - name: Missing secrets
        run: |
          echo "FOLIO_SSH_PRIVATE_KEY / FOLIO_SSH_HOST not configured — deploy skipped."
          echo "See docs/FOLIO-CUTOVER.md"
