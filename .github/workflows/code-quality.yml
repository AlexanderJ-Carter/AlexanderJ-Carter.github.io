name: Folio quality

on:
  push:
    branches: [main]
    paths:
      - 'folio/**'
      - '.github/workflows/code-quality.yml'
  pull_request:
    branches: [main]
    paths:
      - 'folio/**'
      - '.github/workflows/code-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: folio-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: folio
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: folio/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit -p tsconfig.json
        env:
          # tsc 不连库；占位满足 dotenv/配置读取
          PAYLOAD_SECRET: ci-typecheck-secret
          DATABASE_URL: file:./ci.db
          NEXT_PUBLIC_SERVER_URL: http://127.0.0.1:3000
