name: Dependabot pnpm lockfile

# Dependabot 更新 npm 依赖时会重写 folio/pnpm-lock.yaml，但常省略顶部的 overrides 段，
# 与 package.json 的 pnpm.overrides 不一致，导致 quality 等任务的 frozen-lockfile 安装失败。
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'folio/package.json'
      - 'folio/pnpm-lock.yaml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: dependabot-pnpm-lockfile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync-lockfile:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: folio
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: folio/pnpm-lock.yaml

      - name: Sync lockfile with package.json overrides
        run: pnpm install --no-frozen-lockfile

      - name: Commit lockfile if changed
        run: |
          cd "$GITHUB_WORKSPACE"
          if git diff --quiet -- folio/pnpm-lock.yaml; then
            echo "pnpm-lock.yaml already in sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add folio/pnpm-lock.yaml
          git commit -m "chore(deps): sync pnpm lockfile with package.json overrides"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
