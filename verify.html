<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>人机验证 - Alexander James Carter的网页</title>
    <meta content="人机验证确认" name="description">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/base/style.default.css" rel="stylesheet">
    <link href="css/base/custom.css" rel="stylesheet">
    <!-- 验证页面专用样式 -->
    <link href="css/pages/verify.css" rel="stylesheet">
    <!-- Cloudflare Turnstile 脚本 -->
    <script async defer src="https://challenges.cloudflare.com/turnstile/v0/api.js"></script>
    <!-- 验证脚本 -->
    <script src="js/verification.js"></script>
</head>

<body>
<a class="back-btn" href="index.html">
    <i class="fas fa-arrow-left me-2"></i>返回主页
</a>

<div class="verification-container">
    <h2 class="verification-title">
        <i class="fas fa-shield-alt"></i><span>人机验证</span>
    </h2>
    <p class="verification-text">为确保网站安全并提供更好的浏览体验，请完成下方的验证，验证完成后即可访问您请求的页面。</p>

    <div class="verification-widget">
        <!-- Cloudflare Turnstile 验证组件 -->
        <div class="cf-turnstile" data-callback="onTurnstileSuccess" data-sitekey="0x4AAAAAABdh_m4Oroh5Egsy"></div>
    </div>

    <div class="loading-indicator" id="loading-indicator">
        <div class="loader"></div>
        <p>正在验证中，请稍候...</p>
    </div>

    <div class="error-message" id="error-message">
        <i class="fas fa-exclamation-circle me-2"></i>验证失败，请重试
    </div>

    <div class="verification-controls">
        <button class="continue-btn" id="continue-btn">
            <i class="fas fa-check-circle me-2"></i>继续访问
        </button>
        <div class="auto-redirect-text" id="auto-redirect-text" style="display: none;">
            <i class="fas fa-clock"></i>将在<span id="countdown">5</span>秒后自动跳转
        </div>
    </div>

    <div class="security-info">
        <i class="fas fa-lock"></i>该验证由 Cloudflare Turnstile 提供安全保障
    </div>
</div>

<!-- 页面专用脚本 -->
<script src="js/verify.js"></script>
</body>

</html>
