    <!-- 主要内容 -->
    <main class="main-content">
        <!-- Hero区域 -->
        <section class="calendar-hero" id="calendar-hero">
            <div class="container">
                <div class="row align-items-center">
                    <div class="col-lg-7" data-aos="fade-right">
                        <div class="calendar-intro">
                            <h1>智能日历系统</h1>
                            <p class="lead">高效管理您的时间，规划美好生活。支持日程管理、节假日显示和个性化提醒功能。</p>
                            <div class="calendar-features">
                                <div class="feature-item">
                                    <i class="fas fa-calendar-check"></i>
                                    <span>节假日提醒</span>
                                </div>
                                <div class="feature-item">
                                    <i class="fas fa-tasks"></i>
                                    <span>日程管理</span>
                                </div>
                                <div class="feature-item">
                                    <i class="fas fa-bell"></i>
                                    <span>智能提醒</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-5" data-aos="fade-left">
                        <div class="calendar-preview">
                            <div class="preview-card">
                                <i class="fas fa-calendar-alt"></i>
                                <h3>今日</h3>
                                <div class="current-date" id="currentDateDisplay"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 日历主体区域 -->
        <section class="calendar-section">
            <div class="container">
                <!-- 工具栏 -->
                <div class="calendar-toolbar">
                    <div class="toolbar-group">
                        <button class="toolbar-button" id="todayBtn">
                            <i class="fas fa-calendar-day"></i>
                            今天
                        </button>
                        <button class="toolbar-button" onclick="calendar.exportCalendar()">
                            <i class="fas fa-download"></i>
                            导出
                        </button>
                    </div>
                    <div class="toolbar-group">
                        <div class="view-toggle">
                            <button class="active">月视图</button>
                            <button>周视图</button>
                            <button>日视图</button>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <!-- 日历主体 -->
                    <div class="col-lg-8">
                        <div class="calendar-container">
                            <div class="calendar-header">
                                <h2 id="calendarTitle">日历</h2>
                                <div class="calendar-nav">
                                    <button id="prevMonth">
                                        <i class="fas fa-chevron-left"></i>
                                    </button>
                                    <div class="current-month">2025年 1月</div>
                                    <button id="nextMonth">
                                        <i class="fas fa-chevron-right"></i>
                                    </button>
                                </div>
                            </div>
                            
                            <div class="calendar-grid">
                                <!-- 星期标题 -->
                                <div class="calendar-weekday">日</div>
                                <div class="calendar-weekday">一</div>
                                <div class="calendar-weekday">二</div>
                                <div class="calendar-weekday">三</div>
                                <div class="calendar-weekday">四</div>
                                <div class="calendar-weekday">五</div>
                                <div class="calendar-weekday">六</div>
                                
                                <!-- 日期将由JavaScript动态生成 -->
                            </div>
                        </div>
                    </div>

                    <!-- 日程侧边栏 -->
                    <div class="col-lg-4">
                        <div class="schedule-sidebar">
                            <div class="schedule-header">
                                <h3>我的日程</h3>
                                <button class="add-schedule-btn" title="添加日程">
                                    <i class="fas fa-plus"></i>
                                </button>
                            </div>
                            <ul class="schedule-list">
                                <!-- 日程列表将由JavaScript动态生成 -->
                                <div class="empty-schedule">
                                    <i class="fas fa-calendar-check"></i>
                                    <p>暂无日程安排</p>
                                </div>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- 添加/编辑日程模态框 -->
    <div class="calendar-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>添加日程</h3>
                <button class="modal-close">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="eventTitle">日程标题 *</label>
                    <input type="text" id="eventTitle" class="form-control" placeholder="输入日程标题" required>
                </div>
                <div class="form-group">
                    <label for="eventDate">日期 *</label>
                    <input type="date" id="eventDate" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="eventTime">时间</label>
                    <input type="time" id="eventTime" class="form-control">
                </div>
                <div class="form-group">
                    <label for="eventDescription">描述</label>
                    <textarea id="eventDescription" class="form-control" rows="3" placeholder="添加日程描述（可选）"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="calendar-button calendar-button-outline" onclick="calendar.closeModal()">
                    取消
                </button>
                <button class="calendar-button" id="saveEvent">
                    <i class="fas fa-save"></i>
                    保存
                </button>
            </div>
        </div>
    </div>

    <script>
        // 显示当前日期
        document.addEventListener('DOMContentLoaded', () => {
            const dateDisplay = document.getElementById('currentDateDisplay');
            if (dateDisplay) {
                const now = new Date();
                const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
                dateDisplay.textContent = now.toLocaleDateString('zh-CN', options);
            }
        });
    </script>
