<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>联系我 - Alexander James Carter的个人网站</title>
    <meta name="description" content="通过多种方式与我取得联系，包括微信、QQ、GitHub和电子邮件">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.default.css">
    <link rel="stylesheet" href="css/custom.css">
    <link rel="stylesheet" href="css/contact.css">
</head>

<body>
<a href="index.html" class="back-btn" aria-label="返回主页">
    <i class="fas fa-arrow-left me-2" aria-hidden="true"></i>返回主页
</a>

<main>
    <div class="contact-container">
        <div class="contact-header">
            <h1>与我联系</h1>
            <p>选择您喜欢的方式与我交流，无论是询问、合作还是分享想法，我都期待您的消息</p>
        </div>

        <div class="contact-grid">
            <!-- 微信联系方式 -->
            <div class="contact-item" onclick="openQrModal('wechat')" tabindex="0" role="button"
                 aria-label="微信联系方式">
                <i class="fab fa-weixin contact-icon weixin-icon" aria-hidden="true"></i>
                <h3 class="contact-title">微信</h3>
                <p class="contact-info">扫码或复制微信号添加好友</p>
                <button class="contact-btn">查看二维码</button>
            </div>

            <!-- QQ联系方式 -->
            <div class="contact-item" onclick="openQrModal('qq')" tabindex="0" role="button" aria-label="QQ联系方式">
                <i class="fab fa-qq contact-icon qq-icon" aria-hidden="true"></i>
                <h3 class="contact-title">QQ</h3>
                <p class="contact-info">扫码或复制QQ号添加好友</p>
                <button class="contact-btn">查看二维码</button>
            </div>

            <!-- GitHub联系方式 -->
            <div class="contact-item" tabindex="0" role="button">
                <a href="https://github.com/alexanderj-carter" target="_blank" rel="noopener" class="contact-link"
                   aria-label="访问GitHub主页">
                    <i class="fab fa-github contact-icon github-icon" aria-hidden="true"></i>
                    <h3 class="contact-title">GitHub</h3>
                    <p class="contact-info">查看我的开源项目与代码</p>
                    <button class="contact-btn">访问主页</button>
                </a>
            </div>

            <!-- 邮件联系方式 -->
            <div class="contact-item" tabindex="0" role="button">
                <a href="mailto:2253940186@qq.com" class="contact-link" aria-label="发送邮件">
                    <i class="fas fa-envelope contact-icon email-icon" aria-hidden="true"></i>
                    <h3 class="contact-title">邮件</h3>
                    <p class="contact-info">2253940186@qq.com</p>
                    <button class="contact-btn">发送邮件</button>
                </a>
            </div>
        </div>

        <div class="language-options text-center mt-5">
            <p>其他语言版本:</p>
            <a href="en/contact-en.html" class="btn btn-outline-primary me-2">English</a>
            <a href="it/contact-it.html" class="btn btn-outline-primary">Italiano</a>
        </div>
    </div>
</main>

<!-- 二维码弹窗 -->
<div id="qr-modal" class="qr-modal" aria-modal="true" role="dialog">
    <div class="qr-modal-content">
        <span class="qr-close" onclick="closeQrModal()" tabindex="0" role="button" aria-label="关闭弹窗">&times;</span>
        <h3 id="qr-title" class="qr-title">扫描二维码</h3>
        <img id="qr-image" src="" alt="二维码" class="qr-image">
        <p id="qr-desc" class="qr-desc">扫描上方二维码添加好友</p>
        <button id="copy-btn" class="copy-btn" onclick="copyContact()">复制账号</button>
    </div>
</div>

<footer>
    <div class="container">
        <div class="row">
            <div class="col-md-6 text-center text-md-start">
                <div class="footer-copyright">
                    <p class="mb-0">&copy; 2023-2025 Alexander James Carter</p>
                    <p class="small">最后更新: <span class="update-date">2025年4月20日</span></p>
                </div>
            </div>
            <div class="col-md-6 text-center text-md-end">
                <div class="footer-links">
                    <a href="terms.html" class="me-3">使用条款</a>
                    <a href="privacy.html" class="me-3">隐私政策</a>
                    <a href="contact.html">联系我们</a>
                </div>
            </div>
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/contact.js"></script>
</body>

</html>
